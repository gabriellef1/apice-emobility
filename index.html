<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0b" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title data-static-seo>Ápice E-Mobility · Motos elétricas</title>
    <meta
      data-static-seo
      name="description"
      content="Ápice E-Mobility, revenda autorizada Aima: scooters, ciclomotores, motos e bikes elétricas. Veja especificações e peça seu orçamento pelo WhatsApp."
    />
    <script>
      // Deep-link no GitHub Pages: public/404.html redireciona pra "/?/rota&query"
      // e este trecho devolve a URL original antes do React Router iniciar.
      // Fonte: https://github.com/rafgraph/spa-github-pages (MIT)
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
